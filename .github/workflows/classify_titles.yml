name: Title classification

# Runs after the scraping workflow completes, so it always has newly
# ingested jobs to process rather than guessing at a schedule offset.
# workflow_run only fires for workflows on the default branch.
#
# The `if` below classifies after ANY completed scrape except a
# skipped one. It used to require conclusion == success, but that
# starved the chain: with 13 scrape jobs, a single unrelated flake
# fails the whole run (observed 2026-10-07: GitHub cancelled the hrge
# job mid-persistence — infra, not code — and this workflow was
# skipped while jobvision/irantalent rows sat unclassified). The
# batch is idempotent over whatever rows are pending, so a partial
# batch is safe to classify; the old guard's benefit never justified
# losing every chain run to one job's flake.
#
# Zero ongoing cost, per the confirmed hard requirement: no API key, no
# per-request billing. The only "cost" is GitHub Actions' own free
# compute minutes (private repos get a real monthly allowance) --
# downloading the ~470MB model once per run plus embedding a few hundred
# rows on CPU takes a few minutes, comfortably within that allowance.
# See normalization/title_classification.py's module docstring for the
# full confirmed design decisions this workflow relies on.
#
# Ordering inside the job: TRANSLATE first, then CLASSIFY. Non-English
# titles (51job's Chinese, Emploitic's French, job.am's Armenian, and
# every multilingual site still queued in the audit spreadsheet) get an
# English translation from the local NLLB batch BEFORE classification
# runs, so the classifier embeds English against the English-only
# taxonomy. Translation covers TITLES here (~1-2s per non-English title
# on CPU); descriptions translate in the local-only batch
# (scripts/run_translation_batch.py --scope descriptions) because NLLB on
# CPU is far too slow for description volume inside a CI job. Still zero
# API cost -- the translation model is local, same as the embedding model.
# See normalization/translation.py's module docstring for the full design.

on:
  workflow_run:
    workflows: ["Scheduled scraping"]
    types: [completed]
  workflow_dispatch: {}   # lets you trigger a classification run manually, independent of a scrape

# Serialize classification runs. Two batches running at once both take
# row locks on the same title rows and deadlock (observed 2026-10-06:
# a manual dispatch overlapped the workflow_run-triggered run and
# psycopg raised DeadlockDetected, failing the victim run). Queuing
# instead of cancelling keeps both batches -- they just take turns.
concurrency:
  group: classify-titles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'skipped' }}
    # 60 (raised from 30 on 2026-10-07): the backfill era doubled the
    # pending corpus (jobvision 1,200+ rows, irantalent 400, reed/glints
    # growing every run) — translation alone was 663 titles in ~7.5
    # minutes and classification then ran 22+ minutes and was killed by
    # the old 30-minute ceiling mid-batch ("The job has exceeded the
    # maximum execution time of 30m0s", run 37559141124). The ceiling
    # still exists for the cold-start case (cache-miss NLLB download
    # ~2.4GB) so a big backfill cannot get killed mid-write; public repo
    # → unlimited minutes anyway.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      # Caches the downloaded model across runs -- without this, every
      # run would re-download ~470MB from Hugging Face before doing any
      # actual classification work.
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/sentence_transformers
          key: sentence-transformers-paraphrase-multilingual-MiniLM-L12-v2

      # Same idea as the embedding-model cache above: without this, every
      # run re-downloads the ~2.4GB NLLB translation weights from
      # Hugging Face before it can translate a single title. The cache
      # lives under ~/.cache/huggingface (where transformers puts it) and
      # is shared across runs via the key below -- bump the -v suffix if
      # TRANSLATE_MODEL_NAME ever changes.
      - name: Cache NLLB translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: nllb-200-distilled-600M-v1

      # Translate non-English titles BEFORE classification so the
      # classifier matches the English taxonomy with English text.
      # continue-on-error is deliberate: translation is an accuracy
      # enhancement, not the reason this workflow exists. If the model
      # download or inference hiccups, classification still runs against
      # native text via the multilingual embedding fallback (degraded but
      # working) instead of leaving the whole batch unclassified until
      # someone notices a red run. Rows whose translation didn't land are
      # simply retried next run (language_code stays NULL).
      - name: Translate non-English titles (before classification)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_translation_batch.py --scope titles

      - name: Run title classification batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_title_classification_batch.py
