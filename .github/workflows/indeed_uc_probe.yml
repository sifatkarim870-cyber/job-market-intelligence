name: Indeed CI probe (debug)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, indeed-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra dev --extra test --extra selenium
      - name: Chrome + Xvfb present
        run: |
          which google-chrome-stable
          google-chrome-stable --version
          which Xvfb
          ls /dev/shm
          free -h
      - name: Probe client with CI env vars
        env:
          INDEED_UC_ENABLED: "false"
          INDEED_HEADLESS: "true"
        run: |
          cd "$GITHUB_WORKSPACE"
          timeout 240 xvfb-run -a uv run python -c "
          from job_market_intel.scrapers.indeed.client import IndeedClient
          from job_market_intel.scrapers.indeed.config import IndeedSettings
          s = IndeedSettings()
          print('headless=', s.headless, 'uc_enabled=', s.uc_enabled)
          c = IndeedClient(settings=s)
          c.open_session()
          print('open_session OK')
          c._driver.get('https://example.com')
          print('TITLE OK:', 'example' in c._driver.page_source.lower())
          c.close_session()
          "
          echo "client probe exit: $?"
          timeout 60 xvfb-run -a google-chrome-stable --no-sandbox --disable-gpu \
            --user-data-dir=/tmp/chrome-probe --dump-dom about:blank 2>&1 | tail -40
          echo "chrome exit: $?"
          timeout 60 xvfb-run -a google-chrome-stable --no-sandbox --disable-gpu \
            --headless=new --dump-dom https://example.com 2>&1 | head -5
          echo "chrome headless exit: $?"
          ulimit -a
          dmesg 2>/dev/null | tail -20 || true
