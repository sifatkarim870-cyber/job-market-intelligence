name: Indeed CI probe (debug)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, indeed-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra dev --extra test --extra selenium
      - name: Chrome + Xvfb present
        run: |
          which google-chrome-stable
          google-chrome-stable --version
          which Xvfb
          ls /dev/shm
          free -h
      - name: Probe plain seleniumbase under xvfb-run
        run: |
          cd "$GITHUB_WORKSPACE"
          xvfb-run -a uv run python -c "
          from seleniumbase import Driver
          d = Driver(browser='chrome', headless2=False)
          d.get('https://example.com')
          print('TITLE OK:', 'example' in d.page_source.lower())
          d.quit()
          "
