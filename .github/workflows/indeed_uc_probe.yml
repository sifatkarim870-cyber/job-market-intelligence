name: Indeed CI probe (debug)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, indeed-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra dev --extra test --extra selenium
      - name: Chrome + Xvfb present
        run: |
          which google-chrome-stable
          google-chrome-stable --version
          which Xvfb
          ls /dev/shm
          free -h
      - name: Probe seleniumbase variants
        env:
          INDEED_UC_ENABLED: "false"
          INDEED_HEADLESS: "true"
        run: |
          cd "$GITHUB_WORKSPACE"
          set +e
          for m in plain plain_ns plain_all_eager plain_all; do
            echo "=== MODE $m ==="
            timeout 60 xvfb-run -a .venv/bin/python scripts/_probe_sb_mode.py "$m" || echo "MODE $m exit=$?"
          done
          echo "ALL PROBES DONE ============"
