name: Indeed CI probe (debug)
on:
  workflow_dispatch:
    inputs:
      variants:
        description: Space-separated flag-set names to try (see scripts/_probe_raw_session.py)
        required: false
        default: "minimal client-args minimal-heavy-process"

jobs:
  probe:
    runs-on: [self-hosted, indeed-runner]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra dev --extra test --extra selenium
      - name: Install Chrome and Xvfb
        run: |
          which google-chrome-stable
          google-chrome-stable --version
          which Xvfb
          echo "=== /dev/shm ==="
          df -h /dev/shm
          echo "=== memory ==="
          free -m
          nproc
      - name: Try each Chrome flag set in its own process
        env:
          INDEED_UC_ENABLED: "false"
          INDEED_HEADLESS: "true"
        run: |
          # The job shell is `bash -e`, so without this a single failing
          # pkill (nothing left to kill) aborts the step and every later
          # variant silently goes unrun.
          set +e

          # Memory is the suspected root cause (837MiB total, no swap, and
          # available memory measured anywhere between 279MiB and 378MiB on
          # different runs), and xvfb-run holds an X server resident for the
          # whole job even though headless=new never reads DISPLAY. Compare
          # against the same variants with no display at all.
          echo "=== with xvfb ==="
          for variant in ${{ inputs.variants }}; do
            echo "----- PROBING (xvfb) $variant -----"
            # One process per attempt on purpose: a browser that half-starts
            # and wedges must not be able to affect the next attempt.
            timeout 150 xvfb-run -a .venv/bin/python scripts/_probe_raw_session.py "$variant"
            echo "----- exit=$? for (xvfb) $variant -----"
            pkill -x chromedriver 2>/dev/null
            pkill -x chrome 2>/dev/null
            sleep 2
          done

          # Now the same variants with no display at all. If these succeed
          # where the xvfb runs failed, the X server's memory is the problem
          # and the fix belongs in scrape.yml (drop xvfb), not in client.py.
          echo "=== without xvfb ==="
          for variant in ${{ inputs.variants }}; do
            echo "----- PROBING (no-xvfb) $variant -----"
            timeout 150 .venv/bin/python scripts/_probe_raw_session.py "$variant"
            echo "----- exit=$? for (no-xvfb) $variant -----"
            pkill -x chromedriver 2>/dev/null
            pkill -x chrome 2>/dev/null
            sleep 2
          done

          echo "=== last chromedriver.log ==="
          tail -n 40 /tmp/chromedriver.log 2>/dev/null || echo "(none)"
          echo "=== kernel oom kills ==="
          dmesg 2>/dev/null | grep -i -E 'out of memory|oom-kill|killed process' | tail -n 20 || echo "(no dmesg access)"
          echo "=== top memory consumers ==="
          ps -eo pid,rss,comm --sort=-rss 2>/dev/null | head -n 15 || echo "(no ps)"
          echo "ALL PROBES DONE ============"