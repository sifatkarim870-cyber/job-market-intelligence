name: Kaggle watchdog

# The daily Kaggle schedule fires the translation kernel at ~09:03 UTC, and
# every scheduled firing observed (2026-10-24 through -31) was allocated a
# CPU-only slot -- {"torch": "2.11.0+cpu", "gpus": 0} -- where the kernel's
# fail-fast guard aborts in ~10 seconds. The kernel code and metadata are
# correct (enable_gpu, NvidiaTeslaT4, the CUDA BYOD image); the difference is
# that a manual `kaggle kernels push` WAITS for a GPU (3/3 successes) while a
# UI-scheduled session does not. Kaggle's API exposes no schedule field to fix,
# the schedule UI has no accelerator setting, and Kaggle returns HTTP 403 for
# /api/v1/kernels/status from GitHub Actions' datacenter IP range (verified on
# the watchdog's first run). So this watchdog does NOT call Kaggle at all.
#
# It uses the Hugging Face translations dataset as the system of record: if
# today's scheduled run succeeded, the overlay was re-published after the
# 09:03 UTC window opened (a healthy GPU run publishes within ~10 minutes).
# ~20 minutes after the window, if the overlay is stale, the watchdog re-pushes
# the current notebook verbatim -- a push is also a run, and a push queues for
# a GPU.
#
# One daily run is deliberate -- the re-push consumes GPU quota. A second
# attempt would only help if the re-push itself failed, which shows up red here
# anyway.
#
# The watchdog script exits 1 whenever today's overlay is stale -- even after a
# successful re-push -- so a red X means "the scheduled run failed today", which
# is the notification. The annotation below spells out what was done about it.
# Hugging Face is read anonymously (the dataset is public); if HF is
# unreachable, the script exits 1 WITHOUT pushing -- a blind double-run is
# worse than a missed day.

on:
  schedule:
    # 09:23 UTC daily (15:23 local, ~20 min after the 09:03 UTC scheduled
    # window). Off the hour on purpose: GitHub queues scheduled workflows and
    # the top of the hour is the worst slot.
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    name: Re-queue jmi-translate-hf if the scheduled run died
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: uv sync --extra test

      # The script imports only the standard library; the kaggle CLI is
      # provided at runtime via --with. HF is checked anonymously, so no token
      # is needed for the staleness check; KAGGLE credentials are needed only
      # for the re-push itself.
      - name: Check overlay freshness and re-push if stale
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: uv run --with kaggle python scripts/kaggle_watchdog.py

      - name: Summary
        if: always()
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          {
            echo "### Kaggle watchdog — jmi-translate-hf"
            echo ""
            echo '```'
            uv run --with kaggle python scripts/kaggle_watchdog.py --dry-run || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The re-push is the remediation; the annotation is the notification.
      # Without the message text here, a red X on a job that auto-fixed the
      # problem would read as something still broken and train you to ignore it.
      - name: Annotate failure
        if: failure()
        run: |
          echo "::error title=Kaggle translation kernel errored::The daily scheduled run of mskarim870/jmi-translate-hf died (almost always: Kaggle allocated a CPU-only slot and the kernel's guard aborted in ~10s; Kaggle's status API returns 403 from GitHub's IP range, so the watchdog uses the Hugging Face overlay's last-modified time as the success signal). The watchdog has re-pushed the current notebook, which re-queues it for a GPU slot -- check https://www.kaggle.com/code/mskarim870/jmi-translate-hf for the new version's run. If this annotation repeats daily, the re-pushes are also failing: check this workflow's logs for the pull/push output, and confirm the GPU quota has not run out ('kaggle quota'). No translations are lost either way -- the kernel aborts before uploading, so the overlay stays intact."
