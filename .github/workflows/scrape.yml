name: Scheduled scraping

# Runs each scraper independently on a schedule. This replaces the
# in-process APScheduler (src/job_market_intel/scheduler/) for production
# use: instead of one long-lived process on a machine that has to stay
# on, GitHub spins up a fresh runner per job, runs one scraper script,
# then tears the runner down. scheduler/ can stay in the repo for local
# dev convenience, but nothing here depends on it.
#
# All feed-based sources share one interval (every 12 hours) rather
# than separate per-source schedules — this project's stated principle is
# to avoid unnecessary abstraction until something concrete needs it, and
# nothing currently does. Remotive's own scraper config already assumed
# a 12-hour interval (see scrapers/remotive/config.py) and documents a
# ceiling of 4 requests/day; twice a day stays well under that. WWR's
# RSS feed and RemoteOK's public API have no documented rate ceiling at
# this frequency either. Change the cron lines below if you later want
# different cadences per source — each job is independent. Emploitic
# (added 2026-10-05) fetches 5 paginated listing pages per run (~0.06
# req/min), also well within any reasonable politeness budget at 2x/day.
#
# reed also shares the same 12-hour cron. Closer to indeed's shape than
# the first three's: each run claims REED_QUERIES_CLAIMED_PER_RUN rows
# (default 5) from its own separate queue, ops.reed_search_queue — NOT
# ops.scrape_query_queue, which is indeed's own table; see
# migrations/add_reed_search_queue_table.sql's header comment for why
# they're deliberately separate. That table must already exist and be
# seeded before this job can do anything (see that same migration and
# scripts/seed_reed_queries.py) — same unchecked prerequisite as indeed's
# queue. Also needs its own secret, REED_API_KEY (Reed's API requires an
# API key; none of the other sources need any authentication at
# all) — set it under this repo's Settings -> Secrets and variables ->
# Actions before this job can succeed.

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours, on the hour (00:00 and 12:00 UTC)
  workflow_dispatch: {}       # lets you trigger any/all jobs manually from the Actions tab

# Added 2026-10-01, from a GitHub Copilot fix proposed on a branch
# (copilot/fix-reed-job-failure) after the reed job's first-ever run
# failed outright (scripts/run_reed_scraper.py genuinely wasn't pushed
# yet at that point). Good, low-risk, unrelated-but-sensible hardening:
# restricts this workflow's GITHUB_TOKEN to read-only by default, the
# standard least-privilege recommendation for a workflow that doesn't
# need to write back to the repo. Kept even though none of the jobs
# below ever needed more than read access anyway.
permissions:
  contents: read

jobs:
  remoteok:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run RemoteOK scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_remoteok_scraper.py

  emploitic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run Emploitic scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_emploitic_scraper.py

  myjob:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run MyJob.mu scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_myjob_scraper.py

  jobam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run Job.am scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_jobam_scraper.py

  job51:
    runs-on: ubuntu-latest
    # 20, not the boilerplate 15: 51job's first-ever CI run (2026-10-05,
    # session 376) took 14m19s total — the fetch itself was 11s, but
    # persisting 300 brand-new rows to Neon over WAN took 13.5 minutes
    # (per-job insert/describe/salary/geo statements at Neon round-trip
    # latency). Subsequent runs are mostly content-hash unchanged and
    # much faster, but the all-new case is the real one this cap has to
    # survive. If a future run ever crosses 20, lower
    # JOB51_MAX_JOBS_PER_RUN in this job's env rather than raising this.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run 51job scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_job51_scraper.py

  weworkremotely:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run We Work Remotely scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_weworkremotely_scraper.py

  remotive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run Remotive scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_remotive_scraper.py

  reed:
    # NOTE (2026-10-01): a hashFiles()-based guard was here briefly,
    # adapted from an unmerged, never-actually-run Copilot branch
    # (copilot/fix-reed-job-failure), meant to skip this job cleanly if
    # scripts/run_reed_scraper.py was ever missing again. It was invalid
    # GitHub Actions syntax: hashFiles() is only usable in
    # jobs.<job_id>.steps.if, never in a job-level if: -- and GitHub
    # rejects the ENTIRE workflow file when it's misused there, which is
    # exactly what happened (run #61: "Invalid workflow file ...
    # Unrecognized function: 'hashFiles'" -- every job failed, not just
    # this one). Removed rather than relocated: the problem it guarded
    # against (the entrypoint being missing) is already fixed and
    # committed, so the guard wasn't load-bearing, and doing it correctly
    # at step level would mean repeating the same if: on every step below
    # for no real benefit.
    runs-on: ubuntu-latest
    # Slightly more headroom than the other three plain-HTTP jobs'
    # 15 minutes (Reed makes up to REED_QUERIES_CLAIMED_PER_RUN Search
    # calls plus up to REED_MAX_JOBS_PROCESSED_PER_RUN Details calls, not
    # one fetch). Real observed runs during scoping (2026-09-28) took
    # ~7-8 minutes end to end for the defaults (5 queries, 200 jobs) --
    # 20 minutes leaves real margin.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run Reed scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: uv run python scripts/run_reed_scraper.py
