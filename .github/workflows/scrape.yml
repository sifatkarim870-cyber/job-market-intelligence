name: Scheduled scraping

# Runs each scraper independently on a schedule. This replaces the
# in-process APScheduler (src/job_market_intel/scheduler/) for production
# use: instead of one long-lived process on a machine that has to stay
# on, GitHub spins up a fresh runner per job, runs one scraper script,
# then tears the runner down. scheduler/ can stay in the repo for local
# dev convenience, but nothing here depends on it.
#
# All feed-based sources share one interval (every 12 hours) rather
# than separate per-source schedules — this project's stated principle is
# to avoid unnecessary abstraction until something concrete needs it, and
# nothing currently does. Remotive's own scraper config already assumed
# a 12-hour interval (see scrapers/remotive/config.py) and documents a
# ceiling of 4 requests/day; twice a day stays well under that. WWR's
# RSS feed and RemoteOK's public API have no documented rate ceiling at
# this frequency either. Change the cron lines below if you later want
# different cadences per source — each job is independent. Emploitic
# (added 2026-10-05) fetches 5 paginated listing pages per run (~0.06
# req/min), also well within any reasonable politeness budget at 2x/day.
# job51 (added 2026-10-05) fetches at most 4 search pages per run (~0.07
# req/min at 2x/day) from an endpoint with no documented rate ceiling;
# its job-level timeout is 20, not 15 — see the comment on the job itself
# for the measured reason.
#
# reed also shares the same 12-hour cron. Closer to indeed's shape than
# the first three's: each run claims REED_QUERIES_CLAIMED_PER_RUN rows
# (default 5) from its own separate queue, ops.reed_search_queue — NOT
# ops.scrape_query_queue, which is indeed's own table; see
# migrations/add_reed_search_queue_table.sql's header comment for why
# they're deliberately separate. That table must already exist and be
# seeded before this job can do anything (see that same migration and
# scripts/seed_reed_queries.py) — same unchecked prerequisite as indeed's
# queue. Also needs its own secret, REED_API_KEY (Reed's API requires an
# API key; none of the other sources need any authentication at
# all) — set it under this repo's Settings -> Secrets and variables ->
# Actions before this job can succeed.

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours, on the hour (00:00 and 12:00 UTC)
  workflow_dispatch:          # manual runs from the Actions tab; the optional
    inputs:                   # inputs let a Jobinja backfill steer the cursor
      jobinja_start_page:
        description: "First Jobinja listing page to read (backfill cursor)"
        required: false
        default: "1"
      jobinja_max_jobs:
        description: "Jobinja rows fetched per run (window size)"
        required: false
        default: "400"
      irantalent_max_jobs:
        description: "IranTalent rows fetched per run (2000 = full-corpus backfill)"
        required: false
        default: "400"
      jobmaster_max_jobs:
        description: "JobMaster detail rows fetched per run"
        required: false
        default: "400"
      only:
        description: >-
          Comma-separated job names to run (blank = all jobs). The Jobinja
          cursor loop dispatches with only=jobinja so it stops re-running the
          other sources every ~40 min; glints in particular started throttling
          us (read timeouts -> 45 min job timeout) when hit that often.
        required: false
        default: ""

# Added 2026-10-01, from a GitHub Copilot fix proposed on a branch
# (copilot/fix-reed-job-failure) after the reed job's first-ever run
# failed outright (scripts/run_reed_scraper.py genuinely wasn't pushed
# yet at that point). Good, low-risk, unrelated-but-sensible hardening:
# restricts this workflow's GITHUB_TOKEN to read-only by default, the
# standard least-privilege recommendation for a workflow that doesn't
# need to write back to the repo. Kept even though none of the jobs
# below ever needed more than read access anyway.
permissions:
  contents: read

jobs:
  remoteok:
    if: ${{ inputs.only == '' || contains(inputs.only, 'remoteok') }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run RemoteOK scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_remoteok_scraper.py

  emploitic:
    if: ${{ inputs.only == '' || contains(inputs.only, 'emploitic') }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run Emploitic scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_emploitic_scraper.py

  myjob:
    if: ${{ inputs.only == '' || contains(inputs.only, 'myjob') }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run MyJob.mu scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_myjob_scraper.py

  jobam:
    if: ${{ inputs.only == '' || contains(inputs.only, 'jobam') }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run Job.am scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_jobam_scraper.py

  job51:
    if: ${{ inputs.only == '' || contains(inputs.only, 'job51') }
    runs-on: ubuntu-latest
    # 20, not the boilerplate 15: 51job's first-ever CI run (2026-10-05,
    # session 376) took 14m19s total — the fetch itself was 11s, but
    # persisting 300 brand-new rows to Neon over WAN took 13.5 minutes
    # (per-job insert/describe/salary/geo statements at Neon round-trip
    # latency). Subsequent runs are mostly content-hash unchanged and
    # much faster, but the all-new case is the real one this cap has to
    # survive. If a future run ever crosses 20, lower
    # JOB51_MAX_JOBS_PER_RUN in this job's env rather than raising this.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run 51job scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_job51_scraper.py

  weworkremotely:
    if: ${{ inputs.only == '' || contains(inputs.only, 'weworkremotely') }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run We Work Remotely scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_weworkremotely_scraper.py

  remotive:
    if: ${{ inputs.only == '' || contains(inputs.only, 'remotive') }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run Remotive scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/run_remotive_scraper.py

  reed:
    if: ${{ inputs.only == '' || contains(inputs.only, 'reed') }
    # NOTE (2026-10-01): a hashFiles()-based guard was here briefly,
    # adapted from an unmerged, never-actually-run Copilot branch
    # (copilot/fix-reed-job-failure), meant to skip this job cleanly if
    # scripts/run_reed_scraper.py was ever missing again. It was invalid
    # GitHub Actions syntax: hashFiles() is only usable in
    # jobs.<job_id>.steps.if, never in a job-level if: -- and GitHub
    # rejects the ENTIRE workflow file when it's misused there, which is
    # exactly what happened (run #61: "Invalid workflow file ...
    # Unrecognized function: 'hashFiles'" -- every job failed, not just
    # this one). Removed rather than relocated: the problem it guarded
    # against (the entrypoint being missing) is already fixed and
    # committed, so the guard wasn't load-bearing, and doing it correctly
    # at step level would mean repeating the same if: on every step below
    # for no real benefit.
    runs-on: ubuntu-latest
    # Slightly more headroom than the other three plain-HTTP jobs'
    # 15 minutes (Reed makes up to REED_QUERIES_CLAIMED_PER_RUN Search
    # calls plus up to REED_MAX_JOBS_PROCESSED_PER_RUN Details calls, not
    # one fetch). Real observed runs during scoping (2026-09-28) took
    # ~7-8 minutes end to end for the defaults (5 queries, 200 jobs) --
    # 20 minutes leaves real margin.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run Reed scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: uv run python scripts/run_reed_scraper.py

  hrge:
    if: ${{ inputs.only == '' || contains(inputs.only, 'hrge') }
    runs-on: ubuntu-latest
    # 20 minutes for a bounded daily window, NOT a full re-crawl: the
    # full ~3,600-job corpus enters Neon via a local backfill + push
    # (push_indeed_to_neon.py --source-code hrge), and CI's job is
    # catching whatever posted since the last run. HRGE_MAX_PAGES_PER_RUN
    # = 4 pages x 100 = the 400 newest jobs; the site reports ~263
    # postings/day, so 400 clears a 12-hour cycle with real margin, and
    # fetching 400 details (~2-4 min with connection reuse) + mostly
    # hash-unchanged persistence stays well inside the cap. If the daily
    # posting rate ever exceeds ~800, raise this to 5 with the timeout.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run HR.ge scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HRGE_MAX_PAGES_PER_RUN: 4
        run: uv run python scripts/run_hrge_scraper.py

  glints:
    if: ${{ inputs.only == '' || contains(inputs.only, 'glints') }
    runs-on: ubuntu-latest
    # Same split as HR.ge: the full ~130k-job corpus enters Neon via a
    # local backfill + push (push_indeed_to_neon.py --source-code glints),
    # and CI's job is catching whatever posted since the last run.
    # GLINTS_MAX_JOBS_PER_RUN = 400 unique job pages, discovered from
    # the sitemap index round-robin across country families (id/sourced/
    # vn/sg/my — each family's sitemap #1 is its newest), so every
    # country's fresh postings are covered, not just Indonesia's. Pages
    # are 300-500 KB each with a 0.15s politeness delay. Measured on the
    # first CI run (37537783092, 2026-10-07): ~9 min fetch + ~17 min
    # persistence (400 cold INSERTs over the WAN to Neon, each job a
    # savepoint with company/location lookups) = ~26 min total — the
    # persistence leg is the dominant cost and was not in the original
    # 30-minute budget, so 45 gives it real margin. Raise with the
    # posting rate if a family's newest sitemap ever holds >400 fresh
    # jobs between runs.
    # Raised 45 -> 90 on 2026-10-09: when Glints throttles us (Read
    # timed out on glints.com) the retry storm burns the whole budget
    # and the job is cancelled before its INSERTs finish.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run Glints scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GLINTS_MAX_JOBS_PER_RUN: 400
        run: uv run python scripts/run_glints_scraper.py

  jobinja:
    if: ${{ inputs.only == '' || contains(inputs.only, 'jobinja') }
    runs-on: ubuntu-latest
    # Jobinja (jobinja.ir — Iran) has no JSON API and no sitemaps;
    # discovery is listing pagination (/jobs?page=N, 20 jobs/page,
    # strictly newest-first) and details are each page's JSON-LD
    # JobPosting + <h4>/<div class="tags"> sections. Window 400 = 20
    # listing fetches + 400 detail fetches (~120 KB) at a 0.15s
    # politeness delay — fetch is minutes. The cost that matters is the
    # first run's cold persistence: ~400 INSERTs over the WAN with a
    # savepoint each took Glints ~17 of its 26 total minutes, hence the
    # same 45-minute ceiling (public repo → unlimited minutes anyway).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run Jobinja scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Scheduled/manual runs without inputs fall back to the
          # defaults; a backfill dispatch overrides the cursor (the
          # local IP is behind the reCAPTCHA wall — runner IPs are
          # not, every CI Jobinja job passes).
          JOBINGJA_MAX_JOBS_PER_RUN: ${{ inputs.jobinja_max_jobs || '400' }}
          JOBINGJA_START_PAGE: ${{ inputs.jobinja_start_page || '1' }}
        run: uv run python scripts/run_jobinja_scraper.py

  jobvision:
    if: ${{ inputs.only == '' || contains(inputs.only, 'jobvision') }
    runs-on: ubuntu-latest
    # Jobvision discovery downloads one 27 MB sitemap (~60k job URLs,
    # unsorted → skip-known exclusion at selection) then fetches 400
    # records from the public JobPost/Detail JSON API (~8 KB, no auth)
    # at a 0.15s politeness delay — fetch is ~10 minutes worst case
    # (the sitemap alone was observed at 5 minutes from a slow route).
    # The cost that matters is the first run's cold persistence: ~400
    # INSERTs over the WAN with a savepoint each took Glints ~17 of its
    # 30 total minutes, hence the same 45-minute ceiling (public repo →
    # unlimited minutes anyway).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run Jobvision scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOBVISION_MAX_JOBS_PER_RUN: 400
        run: uv run python scripts/run_jobvision_scraper.py

  irantalent:
    if: ${{ inputs.only == '' || contains(inputs.only, 'irantalent') }
    runs-on: ubuntu-latest
    # IranTalent's discovery IS its data source: one open POST search
    # endpoint returns complete job rows inline (30/page, newest-first
    # cursor, no auth), so a run is ~14 page POSTs (~1 minute at the
    # 0.25s politeness delay) plus cold persistence of 400 INSERTs over
    # the WAN — Glints measured ~17 minutes for that half alone, hence
    # a 30-minute ceiling for scheduled runs. 90 (raised from 30 on
    # 2026-10-07): the one-shot full-corpus backfill dispatch
    # (irantalent_max_jobs=2000) must persist 1,472 new rows at the
    # same ~2.7s/row WAN rate ≈ 66+ minutes; scheduled runs still
    # finish in ~20. Public repo → unlimited minutes anyway.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run Irantalent scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Scheduled/manual runs without inputs stay at 400; a
          # full-corpus backfill dispatch overrides the window (the
          # client always reads from page 1, content-hash dedup absorbs
          # the overlap, so a bigger window is the cursor).
          IRANTALENT_MAX_JOBS_PER_RUN: ${{ inputs.irantalent_max_jobs || '400' }}
        run: uv run python scripts/run_irantalent_scraper.py

  jobmaster:
    if: ${{ inputs.only == '' || contains(inputs.only, 'jobmaster') }
    runs-on: ubuntu-latest
    # JobMaster has no API, no sitemap, no anonymous pagination.
    # Discovery probes the open filter cells of /jobs/ (43 headcats x
    # 29 jobtypes, a card page / 10 newest per cell, deepest window is
    # login-walled) and then fetches matching detail pages through
    # checknum.asp. A healthy CI run probes ~800 cells (~25 min at the
    # site's ~1.7s/page TTFB) and persists up to 400 fresh detail rows
    # (~15 min over the WAN); a full-corpus crawl would need several
    # cycles, which is fine — scheduled runs every 12h accumulate the
    # rotating newest-window, uniquely like every other source here but
    # capped by the site itself. 60-minute ceiling.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run JobMaster scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOBMASTER_MAX_JOBS_PER_RUN: ${{ inputs.jobmaster_max_jobs || '400' }}
        run: uv run python scripts/run_jobmaster_scraper.py
