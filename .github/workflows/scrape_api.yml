# Scrapers grouped by HOW THEY FETCH, not by brand.
#
# One workflow per acquisition technique, each with its own cron slot and its own
# per-source timeout, all driven from config/sources.json. Three reasons:
#
#  1. Adding a source becomes one line in config/sources.json instead of a
#     40-line job block here. That is what makes "hundreds of scrapers" tractable.
#  2. The crons are staggered, so the 20-concurrent-job pool is never contended:
#     cheap API sources run often, polite-limited HTML sources run on their own
#     schedule (Glints throttles us when hit too often), browser sources get their
#     own slot because they need minutes just to start Chrome.
#  3. A technique change (e.g. a site growing a JSON API) means moving one line
#     between groups, not rewriting a workflow.
#
# The matrix is built at run time by the `prepare` job with jq, so this file
# stays three workflows instead of fifteen.
#
# fail-fast is OFF on purpose: one dead source must not cancel the other eight.
# scrape.yml is superseded by these three; it is kept in the repo only until the
# grouped runs have proven themselves.

name: Scrape (API)

on:
  schedule:
    # Every 6 hours: these are the cheapest sources (single JSON/RSS requests)
    # and they feed translation, so freshness matters more here than anywhere.
    # Staggered from the HTML group (:23) and the browser group (05:41) so the
    # 20-concurrent pool is never contended and no site sees two passes together.
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Source code to run (blank = every enabled source in this group)"
        required: false
        default: ""
      max_jobs:
        description: "Override the per-run row cap for every source in this run (blank = code defaults)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: build
        name: Build the matrix from config/sources.json
        env:
          GROUP: api
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          matrix=$(jq -c --arg g "$GROUP" --arg only "$ONLY" '
            { include: [ .sources[]
                         | select(.group == $g and .enabled)
                         | select($only == "" or .code == $only)
                         | { code, script, timeout, max_env } ] }' config/sources.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.include[] | "  \(.code)  timeout=\(.timeout)min  \(.script)"'

  scrape:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    services:
      # An EPHEMERAL database, seeded from the HF corpus repo.
      #
      # This container is created fresh per job, seeded from `state/` in the
      # corpus dataset repo (scripts/export_state_snapshot.py publishes it; see
      # that script for why core.jobs is deliberately NOT seeded), and thrown
      # away when the job ends. Nothing to exhaust.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jmi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Seed the ephemeral database from the HF state snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run python scripts/restore_state_snapshot.py --source hf \
            --dsn "postgresql+psycopg://postgres:postgres@localhost:5432/jmi_ci"

      - name: Apply the row-cap override
        # Each scraper reads its own env var (registry `max_env`); GitHub cannot
        # build env maps from matrix data, so write NAME=VALUE into $GITHUB_ENV.
        if: inputs.max_jobs != ''
        env:
          MAX_ENV: ${{ matrix.max_env }}
          MAX_JOBS: ${{ inputs.max_jobs }}
        run: |
          if [ -z "$MAX_ENV" ]; then
            echo "${{ matrix.code }} has no row cap; ignoring max_jobs"
          else
            echo "$MAX_ENV=$MAX_JOBS" >> "$GITHUB_ENV"
            echo "row cap: $MAX_ENV=$MAX_JOBS"
          fi

      - name: Run ${{ matrix.code }} scraper
        # Per-source cap from config/sources.json. See scrape_html.yml for why
        # this was previously declared and never applied.
        timeout-minutes: ${{ matrix.timeout }}
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jmi_ci
          # Reed's ReedSettings.api_key is a required field with no default, so
          # without this the run dies on
          #   ValidationError: api_key  Field required
          # The REED_API_KEY secret has existed in the repo since 2026-09-29 but
          # was never passed to the step, so EVERY scheduled Scrape (API) run
          # has failed on reed: 2026-10-09T23:08Z (28s) and 2026-10-10T05:32Z
          # (18m58s). Harmless to the other sources (each reads its own
          # REED_-prefixed vars and ignores the rest), and fail-fast:false
          # already keeps one dead source from cancelling the others.
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          # USAJOBS is the same trap as Reed, and the same fix. Its key is a
          # data.gov Authorization-Key; without it the pipeline raises
          # USAJobsAuthError before fetching anything, because it aborts on a
          # missing key rather than reporting a successful run that persisted
          # nothing. Set the secret AND pass it here -- a secret that exists but
          # is not wired to the step is indistinguishable from no secret.
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
        run: uv run python ${{ matrix.script }}

      - name: Did the scraper persist any rows?
        # Runs even when the scraper exited non-zero. A partially failed scrape
        # must still publish the rows it did persist; only a run with zero rows
        # is skipped. The ephemeral database starts without core.jobs, so a
        # non-zero count means this run wrote something.
        id: persisted
        if: always()
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jmi_ci
          SOURCE_CODE: ${{ matrix.code }}
        run: |
          count=$(uv run python scripts/count_source_rows.py --source "$SOURCE_CODE")
          echo "rows=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_rows=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rows=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract description sections
        if: success()
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jmi_ci
        run: uv run python scripts/fill_description_sections.py

      - name: Export new rows to a Hugging Face shard
        # The analysis-ready rows also go out as zstd Parquet (measured 692 B/row,
        # ~7x smaller than the relational tables). Incremental: a per-source
        # watermark in the dataset repo means this costs one indexed scan, not a
        # table copy. Fail-open -- the exporter never exits non-zero, so a
        # Hugging Face outage cannot turn a green scrape red.
        #
        # always(): a scraper that persisted rows and then failed (or timed out)
        # must still publish them. The guard above is what keeps an empty run
        # from exporting nothing.
        if: always() && steps.persisted.outputs.has_rows == 'true'
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jmi_ci
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CORPUS_HF_REPO: ${{ vars.CORPUS_HF_REPO }}
        run: uv run python scripts/export_corpus_shards.py --source ${{ matrix.code }}