# Scrapers grouped by HOW THEY FETCH, not by brand. See scrape_api.yml for the
# full rationale; this is the browser group (a real Chrome via seleniumbase UC).
#
# Deliberately EMPTY by default: config/sources.json has no enabled browser
# source, so this workflow's matrix is {"include":[]} and it exits immediately.
# It exists so that when a site genuinely needs a browser, switching it on is a
# one-word edit in the registry rather than writing a workflow from scratch.
#
# If you enable a source here, also expect to need:
#   * browser setup on the runner (chrome + driver, or a setup-chrome action),
#     because ubuntu-latest ships no Chrome for scripted use;
#   * caching of that browser, or every job pays the install cost;
#   * a generous timeout -- Chrome startup alone is 20-60 s, and UC mode more.

name: Scrape (browser)

on:
  schedule:
    # Once a day, well away from the API (:07) and HTML (:23) slots. Inert until
    # a source is enabled in config/sources.json -- the matrix is then empty and
    # the scrape job is skipped.
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Source code to run (blank = every enabled source in this group)"
        required: false
        default: ""
      max_jobs:
        description: "Override the per-run row cap for every source in this run (blank = code defaults)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: build
        name: Build the matrix from config/sources.json
        env:
          GROUP: browser
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          matrix=$(jq -c --arg g "$GROUP" --arg only "$ONLY" '
            { include: [ .sources[]
                         | select(.group == $g and .enabled)
                         | select($only == "" or .code == $only)
                         | { code, script, timeout, max_env } ] }' config/sources.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$(jq '.include | length' <<< "$matrix")" = "0" ]; then
            echo "no enabled browser sources -- set \"enabled\": true in config/sources.json to use this workflow"
          else
            echo "$matrix" | jq -r '.include[] | "  \(.code)  timeout=\(.timeout)min  \(.script)"'
          fi

  scrape:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    # Ephemeral database seeded from the HF corpus repo; the hosted Neon quota is
    # exhausted. See scrape_api.yml for the full reasoning. This workflow is inert
    # until a browser source is enabled, so the container is only created when the
    # matrix is non-empty.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jmi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Seed the ephemeral database from the HF state snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python scripts/restore_state_snapshot.py --source hf --dsn postgresql+psycopg://postgres:postgres@localhost:5432/jmi_ci

      - name: Set up Chrome
        # Needed only once a browser source is enabled: the scraper expects a
        # Chrome binary plus a driver that seleniumbase can launch in UC mode.
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Apply the row-cap override
        if: inputs.max_jobs != ''
        env:
          MAX_ENV: ${{ matrix.max_env }}
          MAX_JOBS: ${{ inputs.max_jobs }}
        run: |
          if [ -z "$MAX_ENV" ]; then
            echo "${{ matrix.code }} has no row cap; ignoring max_jobs"
          else
            echo "$MAX_ENV=$MAX_JOBS" >> "$GITHUB_ENV"
            echo "row cap: $MAX_ENV=$MAX_JOBS"
          fi

      - name: Run ${{ matrix.code }} scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python ${{ matrix.script }}

      - name: Export new rows to a Hugging Face shard
        # See scrape_api.yml for why this exists and why it cannot fail the run.
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CORPUS_HF_REPO: ${{ vars.CORPUS_HF_REPO }}
        run: uv run python scripts/export_corpus_shards.py --source ${{ matrix.code }}