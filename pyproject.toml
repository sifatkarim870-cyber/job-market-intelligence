[project]
name = "job-market-intel"
version = "0.1.0"
description = "Explainable AI Job Market Intelligence Platform — data foundation for a research-grade, multi-source job posting dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Job Market Intelligence Team" },
]

# --- Base runtime dependencies -----------------------------------------------
# Kept intentionally minimal at this stage (Step 3). No business-logic
# packages (SQLAlchemy, requests/httpx, pandas, etc.) are added until the
# step that actually needs them, per the project's step-scoped build plan.
dependencies = [
    "apscheduler>=3.10,<4.0",
    "beautifulsoup4>=4.15.0",
    # Step: Job.am's Cloudflare challenges plain-``requests`` HTTP from
    # GitHub Actions' runner IPs regardless of User-Agent (three CI
    # attempts, three runner IPs, two UAs -- all 403 "Just a moment..."
    # interstitials; same client passes from a residential IP and from
    # other datacenter fetchers, so the trigger is the TLS/HTTP2
    # fingerprint * combined with the runner's ASN). curl_cffi speaks
    # real curl with browser-impersonated TLS/HTTP2 profiles, which is
    # the standard fix for managed challenges on plain-HTTP endpoints
    # where a JS challenge cannot be solved. Used only by
    # scrapers/jobam/client.py -- other sources keep ``requests``.
    "curl-cffi>=0.7.0",
    "ftfy>=6.3.1",
    "loguru>=0.7.3",
    # Environment/config loading with real validation, type coercion, and
    # clear error messages — exactly what the Step 3 base config loader
    # needs, without hand-rolling env parsing.
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.34.2",
    # Step 29 (title/occupation classification): local multilingual
    # sentence-embedding model, run entirely offline once downloaded --
    # no API key, no per-request cost, no rate limits. Confirmed hard
    # requirement over a hosted LLM API: zero ongoing cost. See
    # normalization/title_classification.py's module docstring for the
    # full confirmed design decisions.
    "sentence-transformers>=3.0,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
# Installed with: uv sync --extra dev
dev = [
    "ruff>=0.6",          # linting + formatting (replaces flake8 + isort + black)
    "mypy>=1.11",         # static type checking
    "pre-commit>=3.7",    # git hook runner for the checks above
]

# Installed with: uv sync --extra test
# (Full test suite is built in Step 14.5; the harness is available from
# day one so nothing needs retrofitting.)
test = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

# Installed with: uv sync --extra docs
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
eda = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "notebook>=7.6.2",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "seaborn>=0.13.2",
    "types-seaborn>=0.13.2.20260728",
]
dashboard = [
    "plotly>=7.0.0",
    "streamlit>=1.63.0",
]
# Installed with: uv sync --extra selenium
# Only the Indeed scraper (Phase 4) needs this — kept as its own extra
# rather than a base dependency for the same reason `dashboard`/`eda`
# are separate: most of this project's tooling (the other three
# scrapers, the schema, the scheduler) never touches a browser, and
# seleniumbase pulls in a real Chromium download on first use.
#
# seleniumbase, not bare selenium: confirmed decision from scoping the
# Indeed scraper. Plain Selenium's default WebDriver protocol is
# fingerprinted and commonly blocked on Indeed; seleniumbase's UC
# ("undetected chrome") mode patches those markers while still exposing
# a Selenium-compatible driver underneath, and is actively maintained
# against an anti-bot landscape expected to keep changing over this
# project's years-long crawl. See scrapers/indeed/client.py's module
# docstring for the full rationale.
selenium = [
    "seleniumbase>=4.31,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_market_intel"]

# ============================================================================
# Tool configuration
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort (import sorting)
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "C90",           # mccabe complexity
]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
plugins = ["pydantic.mypy"]
# Bumped from 3.11 to 3.13 -- Step 29 added sentence-transformers, which
# pulls in numpy; numpy's bundled type stubs use `type X = ...` statement
# syntax requiring Python 3.12+, which a 3.11 target can't parse. The
# actual runtime here is already 3.13 (confirmed via `uv run pytest`'s
# own platform line: "platform win32 -- Python 3.13.14") and
# requires-python is ">=3.11", so this only makes mypy's type-checking
# target match what's actually running -- no runtime behavior change.
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false  # tighten incrementally as modules land

[[tool.mypy.overrides]]
# apscheduler ships no py.typed marker / type stubs as of 3.11.x. Silencing
# import-untyped here (rather than sprinkling `# type: ignore` at each call
# site in scheduler/service.py) is the standard mypy pattern for a
# dependency that just doesn't publish types - our own code that imports it
# is still fully checked.
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# seleniumbase (and the plain `selenium` package it wraps) ships no
# py.typed marker either -- same standard mypy pattern as apscheduler
# above, applied here for scrapers/indeed/client.py's own import.
module = "seleniumbase.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --cov=src/job_market_intel --cov-report=term-missing"
markers = [
    "requires_live_db: needs TEST_DATABASE_URL pointing at a live, schema-applied PostgreSQL instance (auto-skipped otherwise; see tests/integration/conftest.py).",
]
